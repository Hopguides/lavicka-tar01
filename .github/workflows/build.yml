name: Build TAR01 APK

# Sproži se ob vsakem push na main, ALI ročno (Actions → Run workflow)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (za Android build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: |
          npx cap add android || echo "android že obstaja"
          npx cap sync android

      - name: Apply kiosk settings
        run: bash kiosk-patch.sh

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAR01-Izjemni-predmeti-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
